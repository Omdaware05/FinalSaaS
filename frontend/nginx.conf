# FinalSaaS frontend nginx config
# Serves the built SPA and proxies all API traffic to the backend.
#
# The carrier media WebSocket lives under
#   /api/v1/webhooks/.../stream
# so the /api/ proxy below MUST support WebSocket upgrades and keep
# long-lived connections open — hence proxy_http_version 1.1, the
# Upgrade/Connection headers and the 3600s timeouts.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload size for contact CSV imports etc.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- API + webhooks + carrier media WebSocket ----
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (carrier media stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Calls can stay connected for a long time — do not cut them.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- SPA ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
